<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#222a36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Mondial Chuva de Prêmios</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --red: #e2363e;
      --red-dark: #b8242b;
      --navy: #222a36;
      --paper: #ffffff;
      --ink: #1d232d;
      --muted: #5b6575;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--navy);
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
      touch-action: none; overscroll-behavior: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .hud-buttons {
      position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
      display: flex; gap: 8px; z-index: 5;
    }
    .icon-btn {
      width: 52px; height: 52px; border-radius: 14px; border: 0;
      background: rgba(34, 42, 54, .82); color: #fff;
      display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn svg { width: 26px; height: 26px; fill: currentColor; }
    .icon-btn[hidden], .icon-btn svg[hidden] { display: none; }

    .overlay {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center; padding: 16px;
      background: rgba(20, 25, 33, .55);
      backdrop-filter: blur(3px);
    }
    .overlay[hidden] { display: none; }
    .card {
      background: var(--paper); color: var(--ink);
      border-radius: 24px; padding: 24px 28px;
      width: min(680px, 100%); max-height: 100%; overflow: auto;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      text-align: center;
    }
    /* Tela inicial: imagem inteira na altura da tela, laterais com a mesma arte desfocada */
    .start {
      position: fixed; inset: 0; z-index: 10; overflow: hidden;
      display: grid; place-items: center; background: #1f5a2a; cursor: pointer;
    }
    .start[hidden] { display: none; }
    .start-blur {
      position: absolute; inset: -40px; background-size: cover; background-position: center;
      filter: blur(28px) brightness(.7);
    }
    .start-art {
      position: relative; aspect-ratio: 572 / 1024;
      height: min(100vh, 100vw * 1024 / 572);
      height: min(100dvh, 100vw * 1024 / 572);
    }
    .start-art img { width: 100%; height: 100%; object-fit: contain; display: block; }
    /* área sobre o botão "JOGAR AGORA" desenhado na imagem */
    .start-hit {
      position: absolute; left: 14.5%; top: 81.3%; width: 71%; height: 9.2%;
      border: 0; border-radius: 999px; background: transparent; cursor: pointer;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .start-hit:active { transform: scale(.97); }
    .start-hit:disabled { animation: none; cursor: default; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 230, 90, 0); }
      50% { box-shadow: 0 0 0 6px rgba(255, 230, 90, .55), 0 0 28px 6px rgba(255, 230, 90, .35); }
    }
    .start-info {
      position: absolute; left: 50%; bottom: 1.2%; transform: translateX(-50%);
      white-space: nowrap; padding: 4px 12px; border-radius: 999px;
      background: rgba(0,0,0,.45); color: #fff; font-size: clamp(12px, 1.8vh, 16px);
    }
    .start-info:empty { display: none; }
    h2 { margin: 0 0 8px; font-size: clamp(24px, 3.6vw, 34px); color: var(--navy); }
    .btn {
      font: inherit; font-weight: 700; font-size: 22px;
      border: 0; border-radius: 16px; padding: 14px 34px; cursor: pointer;
      background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-dark);
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--red-dark); }
    .btn.secondary { background: #e7eaef; color: var(--navy); box-shadow: 0 4px 0 #c5cad3; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .best { margin-top: 12px; color: var(--muted); font-size: 15px; }
    .final-score { font-size: 56px; font-weight: 800; color: var(--red); margin: 4px 0; }
    .stats { color: var(--muted); font-size: 16px; margin-bottom: 14px; }
    .new-record { color: #1a8f4c; font-weight: 700; font-size: 18px; margin-bottom: 8px; }
    .new-record[hidden] { display: none; }
    @media (max-width: 560px), (max-height: 420px) {
      .card { padding: 16px 18px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud-buttons">
    <button class="icon-btn" id="btnSound" aria-label="Som">
      <svg viewBox="0 0 24 24" id="icoSoundOn"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg viewBox="0 0 24 24" id="icoSoundOff" hidden><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v2.2l2.45 2.45c.03-.2.05-.41.05-.65zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <button class="icon-btn" id="btnFull" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
    <button class="icon-btn" id="btnPause" aria-label="Pausar" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </div>

  <div class="start" id="screenTitle">
    <div class="start-blur" id="startBlur"></div>
    <div class="start-art">
      <img id="startImg" alt="Mondial Chuva de Prêmios">
      <button class="start-hit" id="btnPlay" aria-label="Jogar agora" disabled></button>
      <div class="start-info" id="titleBest">Carregando…</div>
    </div>
  </div>

  <div class="overlay" id="screenPause" hidden>
    <div class="card">
      <h2>Pausado</h2>
      <div class="btn-row">
        <button class="btn" id="btnResume">Continuar</button>
        <button class="btn secondary" id="btnQuit">Menu</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="screenOver" hidden>
    <div class="card">
      <h2>Fim de jogo</h2>
      <div class="new-record" id="newRecord" hidden>Novo recorde!</div>
      <div class="final-score" id="finalScore">0</div>
      <div class="stats" id="finalStats"></div>
      <div class="btn-row">
        <button class="btn" id="btnAgain">Jogar de novo</button>
        <button class="btn secondary" id="btnMenu">Menu</button>
      </div>
    </div>
  </div>

  <script src="assets.js"></script>
  <script src="game.js"></script>
</body>
</html>
